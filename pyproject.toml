[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jobscraper"
version = "0.1.0"
description = "Production-grade job scraper for AI automation analysis"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Job Scraper Team" }
]
keywords = ["scraper", "jobs", "automation", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "httpx>=0.27.0",
    "playwright>=1.42.0",
    "selectolax>=0.3.21",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlmodel>=0.0.16",
    "typer>=0.12.0",
    "tenacity>=8.2.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[project.scripts]
jobscraper = "jobscraper.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["jobscraper"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_ignores = true
